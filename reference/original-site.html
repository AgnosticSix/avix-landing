document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ctar las herramientas que ya utilizas<\u002Fh3><p style=\"font-size:15px; color:#8FA3B5; margin:0;\">Para que la información no tenga que copiarse manualmente entre sistemas.<\u002Fp><\u002Fdiv>\n      <div style=\"border-top:1px solid rgba(255,255,255,.14); padding:24px 0 8px;\" style-hover=\"border-top-color:#00BCD4;\"><h3 style=\"font-family:'Space Grotesk'; font-weight:700; color:#FFFFFF; font-size:20px; margin:0 0 10px; line-height:1.25;\">Crear software cuando lo que existe no alcanza<\u002Fh3><p style=\"font-size:15px; color:#8FA3B5; margin:0;\">Portales, CRM, expedientes, inventarios, tableros o herramientas hechas alrededor de tu operación.<\u002Fp><\u002Fdiv>\n      <div style=\"border-top:1px solid rgba(255,255,255,.14); padding:24px 0 8px;\" style-hover=\"border-top-color:#00BCD4;\"><h3 style=\"font-family:'Space Grotesk'; font-weight:700; color:#FFFFFF; font-size:20px; margin:0 0 10px; line-height:1.25;\">Automatizar tareas repetitivas<\u002Fh3><p style=\"font-size:15px; color:#8FA3B5; margin:0;\">Seguimientos, avisos, captura, clasificación, validación, reportes y tareas administrativas.<\u002Fp><\u002Fdiv>\n      <div style=\"border-top:1px solid rgba(255,255,255,.14); padding:24px 0 8px;\" style-hover=\"border-top-color:#00BCD4;\"><h3 style=\"font-family:'Space Grotesk'; font-weight:700; color:#FFFFFF; font-size:20px; margin:0 0 10px; line-height:1.25;\">Agregar IA donde realmente aporta<\u002Fh3><p style=\"font-size:15px; color:#8FA3B5; margin:0;\">Para leer, resumir, clasificar, investigar, preparar información o detectar pendientes.<\u002Fp><\u002Fdiv>\n      <div style=\"border-top:1px solid rgba(255,255,255,.14); padding:24px 0 8px;\" style-hover=\"border-top-color:#00BCD4;\"><h3 style=\"font-family:'Space Grotesk'; font-weight:700; color:#FFFFFF; font-size:20px; margin:0 0 10px; line-height:1.25;\">Hacer que diferentes procesos trabajen juntos<\u002Fh3><p style=\"font-size:15px; color:#8FA3B5; margin:0;\">Para que una tarea pueda avanzar de un \n      <\u002Fdiv>\n      <ul style=\"list-style:none; margin:0; padding:0; display:flex; flex-direction:column; border-top:1px solid rgba(255,255,255,.1);\">\n        <li style=\"padding:14px 0; border-bottom:1px solid rgba(255,255,255,.1); font-size:15px; color:#C7D3DE; display:flex; gap:14px;\"><span style=\"color:#00BCD4; font-family:'Space Grotesk'; font-size:12px; min-width:18px;\">01<\u002Fspan>Qué puede hacer<\u002Fli>\n        <li style=\"padding:14px 0; border-bottom:1px solid rgba(255,255,255,.1); font-size:15px; color:#C7D3DE; display:flex; gap:14px;\"><span style=\"color:#00BCD4; font-family:'Space Grotesk'; font-size:12px; min-width:18px;\">02<\u002Fspan>Qué información puede utilizar<\u002Fli>\n        <li style=\"padding:14px 0; border-bottom:1px solid rgba(255,255,255,.1); font-size:15px; color:#C7D3DE; display:flex; gap:14px;\"><span style=\"color:#00BCD4; font-family:'Space Grotesk'; font-size:12px; min-width:18px;\">03<\u002Fspan>Qué acciones debe registrar<\u002Fli>\n        <li style=\"padding:14px 0; border-bottom:1px solid rgba(255,255,255,.1); font-size:15px; color:#C7D3DE; display:flex; gap:14px;\"><span style=\"color:#00BCD4; font-family:'Space Grotesk'; font-size:12px; min-width:18px;\">04<\u002Fspan>Cuándo debe detenerse<\u002Fli>\n        <li style=\"padding:14px 0; border-bottom:1px solid rgba(255,255,255,.1); font-size:15px; color:#FFFFFF; display:flex; gap:14px;\"><span style=\"color:#CD7F32; font-family:'Space Grotesk'; font-size:12px; min-width:18px;\">05<\u002Fspan>Qué decisiones siempre pertenecen a una persona<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"ejemplos\" data-screen-label=\"06 Ejemplos\" style=\"position:relative; z-index:1; padding:130px 0 110px;\">\n  <div class=\"wrapx\" style=\"max-width:1220px; margin:0 auto; padding:0 32px;\">\n    <div data-reveal=\"\" style=\"opacity:0; transform:translateY(28px); transition:opacity .9s cubic-bezier(.22,1,.36,1), transform .9s cubic-bezier(.22,1,.36,1); font-family:'Space Grotesk'; font-size:12px; letter-spacing:.3em; text-transform:uppercase; color:#00BCD4;\">Ejemplos<\u002Fdiv>\n    <h2 data-reveal=\"\" style=\"opacity:0; transform:translateY(28px); transition:opacity .9s cubic-bezier(.22,1,.36,1) .1s, transform .9s cubic-bezier(.22,1,.36,1) .1s; font-family:'Space Grotesk'; font-weight:700; color:#FFFFFF; font-size:clamp(2.2rem,5vw,4rem); line-height:1.05; letter-spacing:-.02em; margin:22px 0 0; text-wrap:balance;\"><span data-scramble=\"\" data-text=\"¿Dónde podría funcionar?\">¿Dónde podría funcionar?<\u002Fspan><\u002Fh2>\n    <div data-reveal=\"\" style=\"opacity:0; transform:translateY(28px); transition:opacity .9s cubic-bezier(.22,1,.36,1) .2s, transform .9s cubic-bezier(.22,1,.36,1) .2s; display:flex; flex-wrap:wrap; gap:10px; margin-top:44px;\" role=\"tablist\">\n      <button type=\"button\" data-tab=\"inm\" role=\"tab\" style=\"font-family:'Space Grotesk'; font-size:14px; letter-spacing:.04em; padding:12px 22px; border-radius:999px; border:1px solid #00BCD4; background:#00BCD4; color:#050B14; cursor:pointer; min-height:44px;\">Bienes inmuebles<\u002Fbutton>\n      <button type=\"button\" data-tab=\"ind\" role=\"tab\" style=\"font-family:'Space Grotesk'; font-size:14px; letter-spacing:.04em; padding:12px 22px; border-radius:999px; border:1px solid rgba(255,255,255,.14); background:transparent; color:#C7D3DE; cursor:pointer; min-height:44px;\" style-hover=\"border-color:rgba(0,188,212,.6);\">Fábricas e industria<\u002Fbutton>\n      <button type=\"button\" data-tab=\"ser\" role=\"tab\" style=\"font-family:'Space Grotesk'; font-size:14px; letter-spacing:.04em; padding:12px 22px; border-radius:999px; border:1px solid rgba(255,255,255,.14); background:transparent; color:#C7D3DE; cursor:pointer; min-height:44px;\" style-hover=\"border-color:rgba(0,188,212,.6);\">Servicios profesionales<\u002Fbutton>\n    <\u002Fdiv>\n    <div data-reveal=\"\" style=\"opacity:0; transform:translateY(28px); transition:opacity .9s cubic-bezier(.22,1,.36,1) .25s, transform .9s cubic-bezier(.22,1,.36,1) .25s; margin-top:28px; border:1px solid rgba(255,255,255,.1); border-radius:20px; background:rgba(255,255,255,.02); padding:clamp(28px,4vw,48px);\">\n      <div data-panel=\"inm\" role=\"tabpanel\" class=\"g2\" style=\"display:grid; grid-template-columns:1fr 1fr; gap:clamp(24px,5vw,72px); align-items:start;\">\n        <h3 style=\"font-family:'Space Grotesk'; font-weight:700; color:#FFFFFF; font-size:clamp(1.6rem,3vw,2.3rem); line-height:1.15; margin:0; letter-spacing:-.01em; text-wrap:balance;\">De un prospecto nuevo al seguimiento de la operación.<\u002Fh3>\n        <div>\n          <p style=\"font-size:16px; color:#C7D3DE; margin:0;\">La IA puede ayudar a calificar interesados, revisar documentación, detectar pendientes, programar seguimientos, actualizar propiedades, preparar información y avisar cuando alguien debe intervenir.<\u002Fp>\n          <div style=\"display:flex; flex-wrap:wrap; gap:8px; margin-top:24px;\">\n            <span style=\"font-family:'Space Grotesk'; font-size:12px; color:#C7D3DE; border:1px solid rgba(0,188,212,.35); border-radius:999px; padding:7px 13px;\">Calificar interesados<\u002Fspan><span style=\"font-family:'Space Grotesk'; font-size:12px; color:#C7D3DE; border:1px solid rgba(0,188,212,.35); border-radius:999px; padding:7px 13px;\">Revisar documentos<\u002Fspan><span style=\"font-family:'Space Grotesk'; font-size:12px; color:#C7D3DE; border:1px solid rgba(0,188,212,.35); border-radius:999px; padding:7px 13px;\">Programar seguimientos<\u002Fspan><span style=\"font-family:'Space Grotesk'; font-size:12px; color:#C7D3DE; border:1px solid rgba(0,188,212,.35); border-radius:999px; padding:7px 13px;\">Actualizar propiedades<\u002Fspan><span style=\"font-family:'Space Grotesk'; font-size:12px; color:#C7D3DE; border:1px solid rgba(205,127,50,.45); border-radius:999px; padding:7px 13px;\">Avisar cuando alguien debe intervenir<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-panel=\"ind\" role=\"tabpanel\" class=\"g2\" style=\"display:none; grid-template-columns:1fr 1fr; gap:clamp(24px,5vw,72px); align-items:start;\">\n        <h3 style=\"font-family:'Space Grotesk'; font-weight:700; color:#FFFFFF; font-size:clamp(1.6rem,3vw,2.3rem); line-height:1.15; margin:0; letter-spacing:-.01em; text-wrap:balance;\">Menos persecución entre áreas.<\u002Fh3>\n        <div>\n          <p style=\"font-size:16px; color:#C7D3DE; margin:0;\">Una orden puede avanzar entre compras, producción, calidad, mantenimiento y entrega sin depender de que alguien recuerde avisar al siguiente.<\u002Fp>\n          <p style=\"font-size:16px; color:#8FA3B5; margin:14px 0 0;\">La IA puede detectar faltantes, generar avisos, actualizar información y señalar retrasos.<\u002Fp>\n          <div style=\"display:flex; flex-wrap:wrap; gap:8px; margin-top:24px;\">\n            <span style=\"font-family:'Space Grotesk'; font-size:12px; color:#C7D3DE; border:1px solid rgba(0,188,212,.35); border-radius:999px; padding:7px 13px;\">Compras → producción<\u002Fspan><span style=\"font-family:'Space Grotesk'; font-size:12px; color:#C7D3DE; border:1px solid rgba(0,188,212,.35); border-radius:999px; padding:7px 13px;\">Calidad y mantenimiento<\u002Fspan><span style=\"font-family:'Space Grotesk'; font-size:12px; color:#C7D3DE; border:1px solid rgba(0,188,212,.35); border-radius:999px; padding:7px 13px;\">Detectar faltantes<\u002Fspan><span style=\"font-family:'Space Grotesk'; font-size:12px; color:#C7D3DE; border:1px solid rgba(0,188,212,.35); border-radius:999px; padding:7px 13px;\">Señalar retrasos<\u002Fspan><span style=\"font-family:'Space Grotesk'; font-size:12px; color:#C7D3DE; border:1px solid rgba(205,127,50,.45); border-radius:999px; padding:7px 13px;\">Avisar al siguiente responsable<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-panel=\"ser\" role=\"tabpanel\ );\n    const loader = $('loader');\n    if (this.props.showLoader ?? true) {\n      const pct = $('ldr-pct'); const t0 = performance.now(), dur = 1300;\n      const tick = (t) => {\n        const p = Math.min(1, (t - t0) / dur), eased = 1 - Math.pow(1 - p, 3);\n        if (pct) pct.textContent = Math.round(eased * 100) + '%';\n        if (p < 1) requestAnimationFrame(tick);\n        else { loader.style.opacity = '0'; loader.style.pointerEvents = 'none'; setTimeout(() => { loader.style.display = 'none'; }, 750); }\n      };\n      requestAnimationFrame(tick);\n    } else if (loader) loader.style.display = 'none';\n    this.applyLabel();\n    // scramble: real text keeps geometry; overlay paints glyphs (no layout shift)\n    const CH = 'abcdeghknopqsuvxyz0123456789#=+';\n    const scramble = (el, delay, dur = 1000, offset = 0, total = 0) => {\n      const target = el.dataset.text, n = target.length, t0 = performance.now() + delay, run = (el._run = (el._run || 0) + 1);\n      if (!el._words) {\n        el.textContent = '';\n        const words = []; let i = 0;\n        for (const tok of target.match(/\\S+|\\s+/g) || []) {\n          if (/\\s/.test(tok)) { el.appendChild(document.createTextNode(tok)); i += tok.length; continue; }\n          const s = document.createElement('span'); s.style.position = 'relative'; s.style.display = 'inline-block'; s.style.whiteSpace = 'nowrap';\n          const base = document.createElement('span'); base.textContent = tok; s.appendChild(base);\n          const ov = document.createElement('span'); ov.style.cssText = 'position:absolute; left:0; top:0; white-space:nowrap; pointer-events:none; visibility:hidden;'; ov.setAttribute('aria-hidden', 'true'); s.appendChild(ov);\n          el.appendChild(s); words.push({ base, ov, start: i, text: tok }); i += tok.length;\n        }\n        el._words = words;\n      }\n      const words = el._words;\n      const paint = (on) => words.forEach(w => { w.base.style.visibility = on ? 'hidden' : ''; w.ov.style.visibility = on ? '' : 'hidden'; });\n      const step = (now) => {\n        if (el._run !== run) return;\n        const p = Math.min(1, Math.max(0, (now - t0) / dur));\n        if (p <= 0) { requestAnimationFrame(step); return; }\n        paint(true);\n        const reveal = Math.floor(p * (total || n)) - offset;\n        for (const w of words) {\n          let out = '';\n          for (let j = 0; j < w.text.length; j++) { const gi = w.start + j; out += gi < reveal ? w.text[j] : (Math.random() < .5 ? w.text[j] : CH[Math.random() * CH.length | 0]); }\n          w.ov.textContent = out;\n        }\n        if (p < 1) requestAnimationFrame(step); else paint(false);\n      };\n      requestAnimationFrame(step);\n    };\n    const start = (this.props.showLoader ?? true) ? 1500 : 200;\n    const fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();\n    const a = $('scr-a'), b = $('scr-b');\n    const scrAll = (d) => { if (b) scramble(b, d, 1000); };\n    fontsReady.then(() => scrAll(start));\n    const h1 = a && a.closest('h1');\n    if (h1) h1.addEventListener('mouseenter', () => scrAll(0));\n    this._io = new IntersectionObserver((entries) => {\n      entries.forEach(e => { if (e.isIntersecting) { e.target.style.opacity = '1'; e.target.style.transform = 'none'; this._io.unobserve(e.target); } });\n    }, { threshold: 0.12 });\n    document.querySelectorAll('[data-reveal]').forEach(el => this._io.observe(el));\n    document.querySelectorAll('[data-track]').forEach(el => el.addEventListener('click', () => this.track(el.dataset.track, { label: el.textContent.trim() })));\n    // tabs ejemplos\n    const tabs = [...document.querySelectorAll('[data-tab]')], panels = [...document.querySelectorAll('[data-panel]')];\n    tabs.forEach(b => b.addEventListener('click', () => {\n      const k = b.dataset.tab;\n      tabs.forEach(x => { const on = x.dataset.tab === k; x.style.color = on ? '#050B14' : '#C7D3DE'; x.style.background = on ? '#00BCD4' : 'transparent'; x.style.borderColor = on ? '#00BCD4' : 'rgba(255,255,255,.14)'; x.setAttribute('aria-selected', on ? 'true' : 'false'); });\n      panels.forEach(p => { p.style.display = p.dataset.panel === k ? 'grid' : 'none'; });\n      this.track('vertical_view', { vertical: k });\n    }));\n    // antes/después reproducible\n    const lanes = [[...document.querySelectorAll('[data-lane=\"m\"] [data-st]')], [...document.querySelectorAll('[data-lane=\"a\"] [data-st]')]];\n    const res = $('demo-res'), playBtn = $('demo-play');\n    let playing = false;\n    const play = () => {\n      if (playing) return; playing = true; if (res) res.style.opacity = '.3';\n      lanes.forEach(l => l.forEach(s => { s.style.opacity = '.35'; s.style.borderColor = 'rgba(255,255,255,.08)'; const d = s.querySelector('[data-dot]'); if (d) d.style.background = 'rgba(255,255,255,.2)'; }));\n      const n = Math.max(lanes[0].length, lanes[1].length), dt = 1100;\n      for (let i = 0; i < n; i++) setTimeout(() => {\n        lanes.forEach((l, li) => { const s = l[i]; if (!s) return; const human = s.hasAttribute('data-human'); s.style.opacity = '1'; s.style.borderColor = li ? (human ? 'rgba(205,127,50,.7)' : 'rgba(0,188,212,.55)') : 'rgba(255,255,255,.22)'; const d = s.querySelector('[data-dot]'); if (d) d.style.background = li ? (human ? '#CD7F32' : '#00BCD4') : '#8FA3B5'; });\n        if (i === n - 1) setTimeout(() => { playing = false; if (res) res.style.opacity = '1'; }, 500);\n      }, i * dt);\n    };\n    if (playBtn) playBtn.addEventListener('click', play);\n    const demoSec = $('antes-despues');\n    if (demoSec) { const dio = new IntersectionObserver(es => { es.forEach(e => { if (e.isIntersecting) { play(); dio.disconnect(); } }); }, { threshold: .3 }); dio.observe(demoSec); }\n    // quiz multi-paso\n    const form = $('qz');\n    if (form) {\n      const qs = new URLSearchParams(location.search);\n      ['utm_source', 'utm_medium', 'utm_campaign'].forEach(k => { const i = form.querySelector('[name=\"' + k + '\"]'); if (i && qs.get(k)) i.value = qs.get(k); });\n      const steps = [...form.querySelectorAll('[data-q]')], stepLbl = $('qz-step'), bar = $('qz-bar'), back = $('qz-back'), next = $('qz-next');\n      const ctaLabel = () => this.props.ctaLabel ?? 'Descubrir qué puedo automatizar';\n      let i = 0, started = false;\n      const paintChips = () => form.querySelectorAll('[data-chip]').forEach(c => { const on = c.previousElementSibling && c.previousElementSibling.checked; c.style.background = on ? '#00BCD4' : 'transparent'; c.style.color = on ? '#050B14' : '#C7D3DE'; c.style.borderColor = on ? '#00BCD4' : 'rgba(255,255,255,.14)'; });\n      const show = (k) => {\n        i = k; steps.forEach((s, j) => { s.style.display = j === k ? 'flex' : 'none'; });\n        if (stepLbl) stepLbl.textContent = 'Pregunta ' + (k + 1) + ' de ' + steps.length;\n        if (bar) bar.style.width = ((k + 1) / steps.length * 100) + '%';\n        if (back) back.style.visibility = k === 0 ? 'hidden' : 'visible';\n        if (next) next.textContent = k === steps.length - 1 ? ctaLabel() : 'Siguiente →';\n        const f = steps[k].querySelector('input:not([type=radio]):not([type=checkbox]), textarea'); if (f) f.focus({ preventScroll: true });\n        this.track('quiz_step', { step: k + 1 });\n      };\n      const valid = () => { const req = [...steps[i].querySelectorAll('[required]')]; return req.every(r => r.type === 'radio' ? !!form.querySelector('[name=\"' + r.name + '\"]:checked') : r.value.trim().length > 0) || (req.forEach(r => { if (r.type !== 'radio') { r.style.borderColor = '#CD7F32'; r.addEventListener('input', () => { r.style.borderColor = 'rgba(255,255,255,.14)'; }, { once: true }); } }), false); };\n      form.addEventListener('change', paintChips);\n      form.addEventListener('input', () => { if (!started) { started = true; this.track('quiz_start'); } });\n      form.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') { e.preventDefault(); next.click(); } });\n      if (back) back.addEventListener('click', () => show(Math.max(0, i - 1)));\n      if (next) next.addEventListener('click', () => {\n        if (!valid()) return;\n        if (i < steps.length - 1) { show(i + 1); return; }\n        const fd = new FormData(form), tarea = (fd.get('tarea') || '').toString().trim(), tools = fd.getAll('herramientas');\n        const sum = $('qz-sum');\n        if (sum) sum.textContent = (tarea ? 'Empezando por «' + tarea.slice(0, 90) + (tarea.length > 90 ? '…' : '') + '».' : '') + (tools.length ? ' Hoy eso vive en ' + tools.join(', ') + '.' : '');\n        const book = $('qz-book'); if (book) book.href = 'mailto:contacto@avixsoluciones.com?subject=' + encodeURIComponent('Agendar diagnóstico AVIX — ' + (fd.get('empresa') || '')) + '&body=' + encodeURIComponent([...fd.entries()].filter(([k]) => !k.startsWith('utm')).map(([k, v]) => k + ': ' + v).join('\\n'));\n        this.track('quiz_complete', { personas: fd.get('personas'), sensible: fd.get('sensible') });\n        form.style.display = 'none'; const ok = $('qz-ok'); if (ok) ok.style.display = 'block';\n      });\n      show(0);\n    }\n    // escena + navegación\n    const nav = $('topnav'), gl = $('gl'), navCta = $('nav-cta'), heroCta = $('hero-cta');\n    let navCtaOn = false;\n    const ids = ['inicio', 'te-suena', 'antes-despues', 'que-hace', 'agentes', 'ejemplos', 'como-empezamos', 'equipo', 'cuando', 'faq', 'descubrir'];\n    const secs = ids.map(id => $(id)).filter(Boolean), N = secs.length;\n    const OP = secs.map((s, i) => i === 0 ? 1 : i === N - 1 ? .65 : .5), B = secs.map((s, i) => i === 0 ? 0 : i === N - 1 ? 1.6 : 1.2);\n    const mob = window.matchMedia('(max-width:860px)');\n    const lerp = (a, b, u) => a + (b - a) * u, smooth = u => u * u * (3 - 2 * u), clamp = u => Math.max(0, Math.min(1, u));\n    const heads = secs.map(s => s.querySelector('h1, h2'));\n    const neural = $('neural'), nRoute = $('neural-route'), nPulse = $('neural-pulse'), nGlow = $('neural-pulse-glow');\n    const nLen = nRoute.getTotalLength();\n    const nNodes = [...neural.querySelectorAll('g[fill] circle')].map(c => ({ x: +c.getAttribute('cx'), y: +c.getAttribute('cy'), el: c }));\n    let litHead = null;\n    this._run = true;\n    const frame = (now) => {\n      if (!this._run) return;\n      const y = window.scrollY, vh = window.innerHeight;\n      if (nav) {\n        nav.style.background = y > 40 ? 'rgba(5,11,20,.82)' : 'transparent';\n        nav.style.borderBottom = y > 40 ? '1px solid rgba(255,255,255,.07)' : '1px solid transparent';\n        nav.style.backdropFilter = y > 40 ? 'blur(12px)' : 'none';\n      }\n      if (navCta) {\n        const hc = heroCta ? heroCta.getBoundingClientRect() : null;\n        const show = !hc || hc.bottom < 72;\n        if (show !== navCtaOn) { navCtaOn = show; navCta.style.opacity = show ? '1' : '0'; navCta.style.transform = show ? 'none' : 'translateY(-6px)'; navCta.style.pointerEvents = show ? 'auto' : 'none'; navCta.style.maxWidth = show ? '320px' : '0'; navCta.style.paddingLeft = navCta.style.paddingRight = show ? '20px' : '0'; navCta.style.marginLeft = show ? '0' : '-28px'; }\n      }\n      let idx = 0, within = 0;\n      for (let i = 0; i < N; i++) {\n        const r = secs[i].getBoundingClientRect();\n        if (r.top <= vh * 0.5) { idx = i; within = clamp((vh * 0.5 - r.top) / Math.max(1, r.height)); }\n      }\n      const f = idx + within;\n      if (!this._gl && window.AvixScene && window.THREE && gl) { window.AvixScene.init(gl); this._gl = true; }\n      const i0 = Math.min(N - 1, Math.floor(f)), i1 = Math.min(N - 1, i0 + 1), u = smooth(clamp(f - i0));\n      if (gl) {\n        gl.style.opacity = (lerp(OP[i0], OP[i1], u) * (mob.matches ? 0.75 : 1)).toFixed(3);\n        gl.style.filter = 'blur(' + lerp(B[i0], B[i1], u).toFixed(2) + 'px)';\n      }\n      const fs = f / Math.max(1, N - 1) * 5, is = Math.min(5, Math.floor(fs + 0.0001));\n      if (neural) neural.style.transform = 'translateX(' + (2 - (fs / 5) * 6).toFixed(2) + 'vw) scale(.92)';\n      const t2 = (now % 14000) / 14000, d2 = nLen * t2, p2 = nRoute.getPointAtLength(d2);\n      nPulse.setAttribute('cx', p2.x); nPulse.setAttribute('cy', p2.y);\n      nGlow.setAttribute('cx', p2.x); nGlow.setAttribute('cy', p2.y);\n      for (const nd of nNodes) { const dd = Math.hypot(nd.x - p2.x, nd.y - p2.y); const k = clamp(1 - dd / 140); nd.el.setAttribute('r', (2.5 + k * 3.5).toFixed(1)); nd.el.style.fill = k > 0 ? 'rgba(' + (k * 205 | 0) + ',' + (188 - k * 61 | 0) + ',' + (212 - k * 162 | 0) + ',' + (0.32 + k * 0.6).toFixed(2) + ')' : ''; }\n      let lp = null;\n      if (this._gl) lp = window.AvixScene.update(fs, is, now, this.props.sectionMotion ?? true, this.props.nodeLight ?? true);\n      const head = heads[idx];\n      if ((!lp || !(this.props.nodeLight ?? true)) && litHead) { litHead.style.textShadow = 'none'; litHead.style.filter = 'none'; litHead = null; }\n      if (head && lp && (this.props.nodeLight ?? true)) {\n        if (litHead && litHead !== head) { litHead.style.textShadow = 'none'; litHead.style.filter = 'none'; }\n        litHead = head;\n        const hr = head.getBoundingClientRect();\n        const dx = lp.x - (hr.left + hr.width / 2), dy = lp.y - (hr.top + hr.height / 2);\n        const k = clamp(1 - Math.sqrt(dx * dx + dy * dy) / (Math.max(window.innerWidth, 900) * 0.6));\n        head.style.textShadow = '0 0 ' + (14 + k * 40).toFixed(0) + 'px rgba(0,188,212,' + (k * 0.9).toFixed(3) + '), 0 0 ' + (k * 90).toFixed(0) + 'px rgba(0,188,212,' + (k * 0.35).toFixed(3) + ')';\n        head.style.filter = 'brightness(' + (1 + k * 0.25).toFixed(3) + ')';\n      }\n      requestAnimationFrame(frame);\n    };\n    requestAnimationFrame(frame);\n    this._vis = () => {\n      if (document.hidden) { this._run = false; }\n      else if (!this._run && !this._dead) { this._run = true; requestAnimationFrame(frame); }\n    };\n    document.addEventListener('visibilitychange', this._vis);\n  }\n  componentWillUnmount() {\n    this._run = false; this._dead = true;\n    if (this._vis) document.removeEventListener('visibilitychange', this._vis);\n    if (this._io) this._io.disconnect();\n  }\n  renderVals() { return {}; }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
